function buildBackup(){stopPainting();saveColors();return{app:'Time Management',version:1,exportedAt:new Date().toISOString(),templates:{work:[...templates.work],rest:[...templates.rest]},week:[...weekState],view:{...view},currentTemplate,editingLocked}}
function validateBackup(data){if(!data||data.app!=='Time Management'||data.version!==1)throw new Error(t('Это не поддерживаемый файл резервной копии.'));if(!data.templates||!valid(data.templates.work,48)||!valid(data.templates.rest,48))throw new Error(t('В файле повреждены шаблоны.'));if(!Array.isArray(data.week)||data.week.length!==7||!data.week.every(v=>v===0||v===1))throw new Error(t('В файле повреждены дни недели.'));if(!data.view||typeof data.view!=='object'||Array.isArray(data.view))throw new Error(t('В файле повреждены настройки.'));const cleanView={...defaultView};for(const key of Object.keys(defaultView)){if(!(key in data.view))continue;const value=data.view[key];if(typeof value!==typeof defaultView[key]||(typeof value==='number'&&!Number.isFinite(value)))throw new Error(t('В файле некорректные настройки.'));cleanView[key]=boundedViewValue(key,value)}for(const key of ['workColor','restColor','sleepColor','bgColor','textColor','markerColor','timeColor'])if(!/^#[0-9a-f]{6}$/i.test(cleanView[key]))throw new Error(t('В файле некорректный цвет.'));if(!['black','custom','image'].includes(cleanView.background)||!['sans','rounded','mono','montserrat'].includes(cleanView.fontFamily)||!['standard','time','progress','compact'].includes(cleanView.centerMode))throw new Error(t('В файле неизвестный вариант оформления.'));if(cleanView.image&&!['data:image/png;base64,','data:image/jpeg;base64,','data:image/webp;base64,'].some(prefix=>cleanView.image.startsWith(prefix)))throw new Error(t('В файле некорректная картинка.'));if(!['work','rest'].includes(data.currentTemplate)||typeof data.editingLocked!=='boolean')throw new Error(t('В файле повреждено состояние приложения.'));if(!['ru','en'].includes(cleanView.language))throw new Error('Invalid language.');if(!['dark','light'].includes(cleanView.theme))throw new Error(t('Неизвестная тема.'));cleanView.panelTransparency=cleanView.panelTransparency>0?30:0;cleanView.themeProfiles={dark:cleanThemeProfile(data.view.themeProfiles?.dark),light:cleanThemeProfile(data.view.themeProfiles?.light,true)};return{...data,view:cleanView}}
function storeBackup(data){const values={[templateKey]:JSON.stringify(data.templates),[weekKey]:JSON.stringify(data.week),[viewKey]:JSON.stringify(data.view),[storageKey]:JSON.stringify(data.templates[data.currentTemplate]),[lockStorageKey]:String(data.editingLocked),[manualKey]:JSON.stringify({day:localDay(),template:data.currentTemplate})};const previous={};for(const key of Object.keys(values))previous[key]=localStorage.getItem(key);try{for(const [key,value] of Object.entries(values))localStorage.setItem(key,value)}catch(error){for(const [key,value] of Object.entries(previous)){try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value)}catch{}}throw new Error(t('Не удалось сохранить копию в браузере. Возможно, недостаточно места.'))}}
document.getElementById('export-backup').addEventListener('click',()=>{try{const blob=new Blob([JSON.stringify(buildBackup(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='time-management-'+localDay()+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('backup-message').textContent=t('Резервная копия сохранена в файл.')}catch{document.getElementById('backup-message').textContent=t('Не удалось сохранить файл.')}});
const backupInput=document.getElementById('backup-file');document.getElementById('import-backup').addEventListener('click',()=>backupInput.click());
backupInput.addEventListener('change',async()=>{const file=backupInput.files[0];if(!file)return;try{if(file.size>8000000)throw new Error(t('Файл слишком большой. Допустимо до 8 МБ.'));let parsed;try{parsed=JSON.parse(await file.text())}catch{throw new Error(t('Не удалось прочитать файл JSON.'))}const data=validateBackup(parsed);if(!window.confirm(t('Заменить оба шаблона, дни недели и оформление данными из этого файла?')))return;storeBackup(data);window.location.reload()}catch(error){document.getElementById('backup-message').textContent=error.message}finally{backupInput.value=''}});

function paintTouchPath(gesture,x,y){const dx=x-gesture.x,dy=y-gesture.y,steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/5));for(let step=1;step<=steps;step++){const target=document.elementFromPoint(gesture.x+dx*step/steps,gesture.y+dy*step/steps)?.closest('[data-slot]');if(target)paint(Number(target.dataset.slot))}gesture.x=x;gesture.y=y}
